services:
  meet:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_VERSION: ${VERSION:-dev}
    image: meet
    container_name: meet
    environment:
      NODE_ENV: production
      PORT: "3000"
      VITE_VERSION: ${VERSION:-dev}
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - bond

networks:
  bond:
    external: true
